<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VoicePay - Voice Assist Payment</title>
<style>
  :root {
    --brand: #2b2a7f;
    --page: #e9ecf5;
    --card: #ffffff;
    --ink: #14142b;
    --muted: #5b5f77;
    --line: #d9dcea;
    --listen: #c2410c;
    --ok: #0f7b5f;
    --bad: #b42318;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Segoe UI", "Nirmala UI", "Noto Sans Devanagari", "Noto Sans Tamil", Arial, sans-serif; background: var(--page); color: var(--ink); min-height: 100vh; display: flex; justify-content: center; }
  .app { width: 100%; max-width: 440px; min-height: 100vh; display: flex; flex-direction: column; position: relative; }

  header { background: var(--brand); color: #fff; padding: 22px 20px 54px; border-radius: 0 0 28px 28px; }
  .hrow { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  header h1 { font-size: 24px; }
  #lang { font-family: inherit; font-size: 15px; font-weight: 600; padding: 7px 10px; border-radius: 10px; border: none; background: #fff; color: var(--brand); cursor: pointer; }
  header p { font-size: 15px; color: #d7d6ff; margin-top: 2px; }
  .bal { margin-top: 14px; background: rgba(255,255,255,0.14); border-radius: 14px; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; }
  .bal span { font-size: 15px; color: #d7d6ff; }
  .bal strong { font-size: 24px; }

  .screens { flex: 1; margin-top: -30px; }
  .screen { display: none; padding: 0 16px 12px; }
  .screen.active { display: block; }

  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .tile { background: var(--card); border: 2px solid var(--line); border-radius: 16px; padding: 14px 8px; font-family: inherit; font-size: 16px; font-weight: 600; color: var(--ink); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
  .tile .ico { font-size: 32px; line-height: 1; }
  .tile:hover { border-color: var(--brand); }

  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
  .topbar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .back { border: none; background: var(--card); border: 2px solid var(--line); border-radius: 12px; font-size: 18px; padding: 8px 14px; cursor: pointer; }
  .topbar h2 { font-size: 21px; color: #fff; }
  .panel label { display: block; font-size: 16px; font-weight: 600; margin: 12px 0 6px; }
  .panel input { width: 100%; padding: 13px; font-size: 18px; border: 2px solid var(--line); border-radius: 12px; font-family: inherit; }
  .info-line { font-size: 18px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .info-line:last-child { border-bottom: none; }
  .big { font-size: 34px; font-weight: 700; color: var(--brand); }

  .say { margin: 12px 16px 0; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; font-size: 17px; line-height: 1.45; }
  .say small { display: block; color: var(--muted); margin-top: 6px; font-size: 15px; }
  .say small:empty { display: none; }

  .dock { background: var(--card); border-top: 1px solid var(--line); padding: 10px 16px 16px; margin-top: 12px; position: sticky; bottom: 0; }
  #status { text-align: center; font-size: 15px; font-weight: 600; color: var(--muted); min-height: 20px; margin-bottom: 6px; }
  #mic { display: block; margin: 0 auto 10px; width: 80px; height: 80px; border-radius: 50%; border: none; background: var(--brand); color: #fff; font-size: 34px; cursor: pointer; }
  #mic.listening { background: var(--listen); }
  .row { display: flex; gap: 8px; }
  .row input { flex: 1; min-width: 0; padding: 12px; font-size: 17px; border: 2px solid var(--line); border-radius: 12px; font-family: inherit; }
  .go { padding: 12px 18px; font-family: inherit; font-size: 17px; font-weight: 700; background: var(--brand); color: #fff; border: none; border-radius: 12px; cursor: pointer; }
  .go.full { width: 100%; margin-top: 16px; }
  .go.ghost { background: #fff; color: var(--brand); border: 2px solid var(--brand); }

  .overlay { display: none; position: absolute; inset: 0; background: rgba(20,20,43,0.55); z-index: 10; align-items: flex-end; }
  .overlay.show { display: flex; }
  .sheet { background: var(--card); width: 100%; border-radius: 24px 24px 0 0; padding: 22px 18px 26px; }
  .sheet h3 { font-size: 22px; margin-bottom: 6px; }
  .sheet p { color: var(--muted); font-size: 16px; margin-bottom: 12px; }
  #success { display: none; position: absolute; inset: 0; background: var(--card); z-index: 20; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; gap: 14px; }
  #success.show { display: flex; }
  #success .tick { width: 96px; height: 96px; border-radius: 50%; background: var(--ok); color: #fff; font-size: 54px; display: flex; align-items: center; justify-content: center; }
  #success h2 { font-size: 26px; }
  #success p { font-size: 18px; color: var(--muted); line-height: 1.5; }

  button:focus-visible, input:focus-visible, select:focus-visible { outline: 4px solid #1570ef; outline-offset: 2px; }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="hrow">
      <h1>VoicePay</h1>
      <select id="lang" data-i18n-aria="langLabel">
        <option value="en-IN">English</option>
        <option value="hi-IN">हिन्दी</option>
        <option value="ta-IN">தமிழ்</option>
      </select>
    </div>
    <p data-i18n="subtitle"></p>
    <div class="bal"><span data-i18n="walletBalance"></span><strong id="balance">₹0</strong></div>
  </header>

  <div class="screens">
    <!-- Page 1: Home -->
    <section class="screen active" id="home">
      <div class="tiles" id="tiles"></div>
    </section>

    <!-- Page 2: Service form -->
    <section class="screen" id="svc">
      <div class="topbar"><button class="back" id="backSvc" data-i18n-aria="backHome">←</button><h2 id="svcTitle"></h2></div>
      <div class="panel">
        <div id="formFields"></div>
        <button class="go full" id="payBtn" data-i18n="payBtn"></button>
      </div>
    </section>

    <!-- Page 3: Balance / history -->
    <section class="screen" id="info">
      <div class="topbar"><button class="back" id="backInfo" data-i18n-aria="backHome">←</button><h2 id="infoTitle"></h2></div>
      <div class="panel" id="infoBody"></div>
    </section>
  </div>

  <div class="say" id="sayBox"><span id="say"></span><small id="heard"></small><small id="voiceNote"></small></div>

  <div class="dock">
    <div id="status" aria-live="polite"></div>
    <button id="mic" data-i18n-aria="micAria">🎤</button>
    <div class="row">
      <input type="text" id="typed" data-i18n-ph="typePh" data-i18n-aria="typePh">
      <button class="go" id="sendTyped" data-i18n="sendBtn"></button>
    </div>
  </div>

  <!-- PIN sheet -->
  <div class="overlay" id="pinOverlay">
    <div class="sheet">
      <h3 data-i18n="pinTitle"></h3>
      <p id="pinInfo"></p>
      <input type="password" id="pin" maxlength="4" inputmode="numeric" data-i18n-ph="pinPh" data-i18n-aria="pinPh" style="width:100%;padding:14px;font-size:20px;border:2px solid var(--line);border-radius:12px;margin-bottom:12px;">
      <div class="row"><button class="go ghost" id="pinCancel" data-i18n="pinCancel"></button><button class="go" id="pinOk" style="flex:1" data-i18n="pinConfirm"></button></div>
    </div>
  </div>

  <!-- Success page -->
  <div id="success">
    <div class="tick">✓</div>
    <h2 id="successTitle"></h2>
    <p id="successText"></p>
    <button class="go" id="doneBtn" data-i18n="backHome"></button>
  </div>

</div>

function t(key, vars) {

  if (vars) for (const k in vars) s = s.split("{" + k + "}").join(vars[k]);
  return s;
}

};
const NUM = new Map(Object.entries(NUM_RAW).map(([k, v]) => [k.normalize("NFC"), v]));
const HUNDRED = new Set(["hundred", "सौ", "நூறு"].map(w => w.normalize("NFC")));
const THOUSAND = new Set(["thousand", "हज़ार", "हजार", "ஆயிரம்", "ஆயிரத்து"].map(w => w.normalize("NFC")));

// Converts Hindi and Tamil digits (०-९, ௦-௯) to normal digits
function normDigits(s) {
  return s.replace(/[०-९]/g, d => "०१२३४५६७८९".indexOf(d)).replace(/[௦-௯]/g, d => "௦௧௨௩௪௫௬௭௮௯".indexOf(d));
}

function parseAmount(text) {
  const t0 = normDigits(norm(text)).replace(/,/g, "");
  const m = t0.match(/\d+(\.\d+)?/);              // "199", "₹500", "500 rupees"
  if (m) return parseFloat(m[0]);
  let total = 0, current = 0, found = false;      // "five hundred", "पाँच सौ", "ஐநூறு"
  for (const w of t0.split(/[\s-]+/)) {
    if (NUM.has(w)) { current += NUM.get(w); found = true; }
    else if (HUNDRED.has(w)) { current = (current || 1) * 100; found = true; }
    else if (THOUSAND.has(w)) { total += (current || 1) * 1000; current = 0; found = true; }
  }
  return found ? total + current : NaN;
}

function digitsFrom(text) {                        // "99943 59332" or "nine nine nine..."
  return normDigits(norm(text)).split(/[\s-]+/).map(w => {
    if (w === "oh") return "0";
    if (NUM.has(w) && NUM.get(w) < 10) return String(NUM.get(w));
    return w.replace(/\D/g, "");
  }).join("");
}

// =====================================================
// OOP: base class + one subclass per service (abstraction)
// =====================================================
class PaymentService {
  // fields: { key, tr (translation id), type, min, max }
  constructor(titleKey, icon, fields, isDebit = true) {
    this.titleKey = titleKey; this.icon = icon; this.fields = fields; this.isDebit = isDebit;
  }
  get title() { return t(this.titleKey); }
  describe(values) { throw new Error("Each service must define describe()"); }

  check(field, raw) {                              // validation shared by all services
    if (field.type === "amount") {
      const n = parseAmount(raw);
      if (!(n > 0)) return { ok: false, msg: t("err_amount") };
      if (this.isDebit && n > store.balance) return { ok: false, msg: t("err_insufficient", { bal: fmt(store.balance) }) };
      if (!this.isDebit && n > 50000) return { ok: false, msg: t("err_limit") };
      return { ok: true, value: n };
    }
    if (field.type === "digits") {
      const d = digitsFrom(raw);
      if (d.length < field.min || d.length > field.max) {
        return { ok: false, msg: field.min === field.max ? t("err_digits", { n: field.min }) : t("err_digitsRange", { a: field.min, b: field.max }) };
      }
      return { ok: true, value: d };
    }
    const s = raw.trim();
    return s.length > 1 ? { ok: true, value: s } : { ok: false, msg: t("err_text") };
  }

  execute(values) {                                // runs after the PIN is correct
    store.balance += this.isDebit ? -values.amount : values.amount;
    const text = this.describe(values);
    store.history.unshift({ title: this.title, text: text, amount: values.amount, debit: this.isDebit, time: new Date().toLocaleString("en-IN") });
    store.history = store.history.slice(0, 20);
    saveStore();
    return text;
  }
}

function mapCommand(text) {
  const c = norm(text);
  if (CMD.balance.test(c)) return new BalanceCheck();
  if (CMD.history.test(c)) return new TransactionHistory();
  if (CMD.addMoney.test(c)) return new AddMoney();
  if (CMD.water.test(c)) return new BillPayment("water", "🚰");

  return null;
}

function updateBalance() { $("balance").textContent = fmt(store.balance); }
function showSay(msg) { $("say").textContent = msg; }

function renderTiles() {
  $("tiles").innerHTML = "";
  SERVICES.forEach(make => {
    const s = make();
    const b = document.createElement("button");
    b.className = "tile";
    b.innerHTML = '<span class="ico">' + s.icon + "</span>" + s.title;
    b.addEventListener("click", () => openService(make()));
    $("tiles").appendChild(b);
  });
}

// Writes all fixed texts of the page in the selected language
function applyLang() {
  document.documentElement.lang = LANG.split("-")[0];
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-ph]").forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  document.querySelectorAll("[data-i18n-aria]").forEach(el => { el.setAttribute("aria-label", t(el.dataset.i18nAria)); });
  renderTiles();
  showSay(t("tapMic"));
  $("heard").textContent = "";
  $("voiceNote").textContent = "";
  $("status").textContent = t("ready");
}

// =====================================================
// Voice output (Speech Synthesis)
// =====================================================
// Returns a matching voice, null if none is installed, or undefined if the list is not loaded yet
function pickVoice() {
  const vs = window.speechSynthesis.getVoices();
  if (!vs.length) return undefined;
  const base = LANG.split("-")[0].toLowerCase();
  const lang = v => v.lang.replace("_", "-").toLowerCase();
  return vs.find(v => lang(v) === LANG.toLowerCase()) || vs.find(v => lang(v).startsWith(base)) || null;
}

function say(message, then) {
  showSay(message);
  let called = false;
  const go = () => { if (called) return; called = true; if (then) setTimeout(then, 250); };
  if (!("speechSynthesis" in window)) { go(); return; }
  window.speechSynthesis.cancel();
  const voice = pickVoice();
  if (voice === null) {                           // no voice for this language: show text only
    $("voiceNote").textContent = t("noVoiceOut");
    setTimeout(go, Math.min(4000, 800 + message.length * 40));
    return;
  }
  $("voiceNote").textContent = "";
  const u = new SpeechSynthesisUtterance(message);
  u.lang = LANG; if (voice) u.voice = voice;
  u.onend = go; u.onerror = go;
  window.speechSynthesis.speak(u);
  setTimeout(go, Math.max(2500, message.length * 110));   // safety net if the browser never reports the end
}
if ("speechSynthesis" in window) window.speechSynthesis.onvoiceschanged = () => {};

// =====================================================
// Voice input (Speech Recognition)
// =====================================================
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, noHear = 0, currentPrompt = "";

function listen() {
  if (!SR) { $("status").textContent = t("noVoiceInput"); return; }
  if (awaitingPin) return;
  try { if (rec) { rec.onend = null; rec.abort(); } } catch (e) {}
  rec = new SR();
  rec.lang = LANG; rec.interimResults = false; rec.maxAlternatives = 1;
  let got = false, lastErr = "";
  rec.onstart = () => { $("mic").classList.add("listening"); $("status").textContent = t("listening"); };
  rec.onresult = e => { got = true; noHear = 0; handleInput(e.results[0][0].transcript); };
  rec.onerror = e => { lastErr = e.error; };
  rec.onend = () => {
    $("mic").classList.remove("listening");
    if (got || awaitingPin) return;
    if (lastErr === "not-allowed" || lastErr === "service-not-allowed") {
      $("status").textContent = t("micBlocked"); return;
    }
    if (lastErr === "no-speech" && noHear < 2) {
      noHear++; say(t("didNotHear") + currentPrompt, listen); return;
    }
    $("status").textContent = t("tryAgain");
  };
  try { rec.start(); } catch (e) { $("status").textContent = t("tryAgain"); }
}

// =====================================================
// Conversation flow
// =====================================================
let svc = null, idx = 0, awaitingPin = false, pinTries = 0, pendingValues = null, welcomed = false;

function goHome() {
  svc = null; idx = 0; awaitingPin = false; pendingValues = null;
  $("pinOverlay").classList.remove("show");
  $("success").classList.remove("show");
  currentPrompt = t("homePrompt");
  updateBalance(); show("home"); $("status").textContent = t("ready");
}

function openService(s) {
  if (!s.fields || s.fields.length === 0) { s.run(); return; }   // info pages
  svc = s; idx = 0; awaitingPin = false;
  $("svcTitle").textContent = s.icon + " " + s.title;
  $("formFields").innerHTML = s.fields.map(f =>
    '<label for="f_' + f.key + '">' + t("lbl_" + f.tr) + '</label><input id="f_' + f.key + '" type="text" autocomplete="off">').join("");
  show("svc");
  ask();
}

function ask() {
  currentPrompt = t("prm_" + svc.fields[idx].tr);
  say(svc.title + ". " + currentPrompt, listen);
}

function handleInput(text) {
  $("heard").textContent = t("youSaid") + text;
  const c = norm(text);

  if (CANCEL.test(c)) {
    say(t("goingHome"), goHome); return;
  }

  if (!svc) {                                   // no service open: understand the command
    const s = mapCommand(text);
    if (!s) { say(t("notUnderstood"), listen); return; }
    openService(s);
    return;
  }

  if (idx >= svc.fields.length) {               // form already full
    if (CONFIRM.test(c)) submitForm();
    else say(t("sayPayConfirm"), listen);
    return;
  }

  const field = svc.fields[idx];
  const result = svc.check(field, text);
  if (!result.ok) { say(result.msg + " " + t("prm_" + field.tr), listen); return; }
  $("f_" + field.key).value = result.value;
  idx++;
  if (idx < svc.fields.length) ask(); else submitForm();
}

// Reads the form (typed or spoken), validates, then asks for the PIN
function submitForm() {
  const values = {};
  for (const f of svc.fields) {
    const raw = $("f_" + f.key).value;
    const r = svc.check(f, raw);
    if (!r.ok) { say(r.msg + " " + t("fixField", { label: t("lbl_" + f.tr) }), null); $("f_" + f.key).focus(); return; }
    values[f.key] = r.value;
  }
  pendingValues = values;
  awaitingPin = true; pinTries = 0;
  try { if (rec) { rec.onend = null; rec.abort(); } } catch (e) {}
  $("mic").classList.remove("listening");
  $("pinInfo").textContent = svc.describe(values);
  $("pinOverlay").classList.add("show");
  $("pin").value = ""; $("pin").focus();
  say(t("pinSay"));
}

function confirmPin() {
  const entered = $("pin").value;
  $("pin").value = "";
  if (entered === PIN) {
    const text = svc.execute(pendingValues);
    $("pinOverlay").classList.remove("show");
    awaitingPin = false;
    updateBalance();
    $("successTitle").textContent = svc.isDebit ? t("paySuccess") : t("moneyAdded");
    $("successText").textContent = text + " " + t("newBalance", { bal: fmt(store.balance) });
    $("success").classList.add("show");
    say(text + " " + t("sayNewBalance", { n: store.balance }));
  } else {
    pinTries++;
    if (pinTries >= 3) { $("pinOverlay").classList.remove("show"); say(t("pinTooMany"), goHome); return; }
    say(t("pinWrong"));
    $("pin").focus();
  }
}

// =====================================================
// Buttons
// =====================================================
$("lang").addEventListener("change", e => {
  LANG = e.target.value;
  try { localStorage.setItem("vp_lang", LANG); } catch (err) {}
  try {
    if ("speechSynthesis" in window) window.speechSynthesis.cancel();
    if (rec) { rec.onend = null; rec.abort(); }
  } catch (err) {}
  $("mic").classList.remove("listening");
  welcomed = false;
  applyLang();
  goHome();
});

$("mic").addEventListener("click", () => {
  if (!svc && !welcomed) {
    welcomed = true;
    say(t("welcome"), listen);
  } else { noHear = 0; listen(); }
});
$("sendTyped").addEventListener("click", () => {
  const box = $("typed");
  if (box.value.trim()) { handleInput(box.value.trim()); box.value = ""; }
});
$("typed").addEventListener("keydown", e => { if (e.key === "Enter") $("sendTyped").click(); });
$("payBtn").addEventListener("click", () => { if (svc) submitForm(); });
$("backSvc").addEventListener("click", goHome);
$("backInfo").addEventListener("click", goHome);
$("pinOk").addEventListener("click", confirmPin);
$("pin").addEventListener("keydown", e => { if (e.key === "Enter") confirmPin(); });
$("pinCancel").addEventListener("click", () => { say(t("cancelled"), goHome); });
$("doneBtn").addEventListener("click", goHome);

// Start
$("lang").value = LANG;
applyLang();
currentPrompt = t("homePrompt");
updateBalance();
</script>
</body>
</html>
